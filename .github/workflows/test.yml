name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  attestations: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build container
        run: docker build --tag measure-image-action:test .

      # The unit tests stub the GitHub CLI, so this runs the container's own
      # tools against published artifacts. It hands the container a token, so
      # it is skipped for pull requests from forks.
      - name: Measure a sample config with the built container
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /cache \
            --tmpfs /root/.cache \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/testdata/smoke-config.yml":/config.yml:ro \
            -e GH_TOKEN \
            measure-image-action:test
          sudo test -s output/tinfoil-deployment.json
